# Main experiment: 3 variables, degree <= 20, 10 binomial generators,
# degrees drawn uniformly ("weighted" monomial distribution).
name: ppo_3-20-10-weighted

env:
  distribution: 3-20-10-weighted
  order: grevlex
  elimination: gebauermoeller
  k: 2                  # two leading terms per polynomial -> 12 features per pair
  feature_scale: 0.05   # exponents / 20

ppo:
  hidden: [128]
  lr: 0.001
  gamma: 0.99
  lam: 0.97
  clip_eps: 0.2
  target_kl: 0.01
  policy_updates: 40
  batch_size: 512
  entropy_coef: 0.0
  value: degree         # degree-strategy rollout as the state-value baseline
  normalize_advantages: true

run:
  epochs: 200
  episodes_per_epoch: 100
  workers: 2
  seed: 0
  checkpoint_every: 25
  smoothing: 10
