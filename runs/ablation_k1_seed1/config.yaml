name: ablation_k1
env:
  distribution: 3-20-10-weighted
  order: grevlex
  elimination: gebauermoeller
  k: 1
  feature_scale: 0.05
ppo:
  hidden:
  - 128
  lr: 0.001
  gamma: 0.99
  lam: 0.97
  clip_eps: 0.2
  target_kl: 0.01
  policy_updates: 40
  batch_size: 512
  entropy_coef: 0.0
  value: degree
  normalize_advantages: true
run:
  epochs: 100
  episodes_per_epoch: 100
  workers: 1
  seed: 1
  checkpoint_every: 25
  smoothing: 10
