[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buchberger-rl"
version = "1.0.0"
description = "Learning S-pair selection strategies for Buchberger's algorithm with reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Setare Ghafouri" }]
keywords = ["groebner bases", "buchberger algorithm", "reinforcement learning", "ppo", "computer algebra"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
